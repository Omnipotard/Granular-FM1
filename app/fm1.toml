# GRAINE's build settings (fm1-base's tools/build.py, through ../build.sh)
name = "GRAINE"                # the build's files: graine.fwsc, graine-X.Y.fwsc
id_prefix = "FM-1_47"          # package identity: dev FM-1_4700, releases FM-1_47XXYYZZ
usb_manufacturer = "GRAINE"
usb_product = "GRAINE FM-1"
o2 = ["dsp/engine.c"]          # the sound, its own unit at -O2
cpu2 = true                    # the second core renders half of the grains (dsp/engine.c grains_job)
cpu2_fallback = true           # after a failure of it: one core (64 grains) until power-off, no restart
words = "words.tsv"
ble = false                    # no radio: its RAM goes to the capture, the echo and the reverb
emu = ["data", "midi"]         # the emulator keeps the data area (kept captures) across reloads; Web MIDI in
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "un synthe granulaire pour le FM-1"
repo = "https://github.com/Omnipotard/Granular-FM1"
licence = "MIT"
credits = "Built on fm1-base (MPL-2.0) and felucca-bsp, from Felucca by Leo Kuroshita (Hugelton Instruments). Every built-in sound is synthesized by tools/gen_sounds.py."
# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "GRAINE contributors"
description = "GRAINE turns the M-VAVE FM-1 into a granular synthesizer: thirteen synthesized sources (five that evolve: an arpeggio, a bass line, chords, a pad, a sequence), your captures and your own sounds sent over USB, read by up to 128 grains in six voices on both cores. Twenty-four pages of four coloured knobs, each drawn over the cloud: stretched grains, chorus, shimmer, tuned resonators, a frozen space, A/B scenes, falling notes, wild grains, a clocked chopper, rhythmic gates, ring and fold. Modulation by gesture, recorded knob gestures, the TAPIS of positions and pads."
tags = ["synth", "sampler", "ambient", "experimental"]
install = "https://omnipotard.github.io/Granular-FM1/install/"   # the site's web installer (tools/site.py)
site = "https://omnipotard.github.io/Granular-FM1/"
screenshot = "app/docs/img/page-cloud.png"
